set hostname                    "PING ~ OpenTDM ~ <location>"
set net_port			"27910"
set g_demo_hostname             "PING??"
set rcon_password               "rconpasshere"
set g_admin_password            "adminpasshere"
set maxclients                  "25"    // this minus sv_reserved_slots is visible max
set public			"0"	// advertised with master server

// q2pro settings
set allow_download              "1"
set allow_download_maps         "2"     // maps from within paks too
set logfile                     "0"     // disabled, overwrite previous
set logfile_flush               "1"     // buffered
set logfile_name                "console.log"
set logfile_prefix              "[%Y-%m-%d %H:%M] @ "   // @ replaced with msg type
set map_override_path           "maps/"         // note the trailing /, location to put <mapname>.ent files
set sv_changemapcmd             ""      // do these cmds on map change
set sv_downloadserver           "http://q2.packetflinger.com/dl/"
set sv_enhanced_setplayer       "1"
set sv_mvd_enable               "2"     // record mvd and transmit to gtv
set sv_mvd_maxclients           "4"
set sv_mvd_maxmaps              "0"
set sv_mvd_password             ""
set sv_mvd_nomsgs               "1"     // don't set team msgs from chase target
set sv_packetdup_hack           "2"
set sv_redirect_address         "gtv.packetflinger.com:27910"	// if server full send, em to gtv
set sv_reserved_password        "letmein"
set sv_reserved_slots           "5"
set sv_show_name_changes        "1"
set sv_timescale_warn           "1.03"
set sv_timescale_kick           "1.06"
set sv_uptime                   "2"

// OpenTDM CVARS
set flood_waves                 "5"
set flood_waves_perminute       "10"
set flood_waves_waitdelay       "20"
set g_1v1_spawn_mode		"1"
set g_1v1_timeout		"60"
set g_admin_vote_decide		"1"
set g_allow_vote_config		"1"
set g_allow_name_change_during_match	"1"
set g_allow_vote_config		"1"
set g_armor_timer		"1"
set g_auto_rejoin_match		"1"
set g_auto_rejoin_map		"1"
set g_bugs			"1"
set g_chat_mode			"0"
set g_command_mask		"-1"
set g_fast_weap_switch		"0"
set g_force_screenshot		"1"
set g_force_record		"1"
set g_gamemode			"0"	// TDM
set g_highlight_captain		"1"
set g_http_bind			""	// outgoing IP
set g_http_domain		"opentdm.org"
set g_http_debug		"0"
set g_http_enabled		"1"
set g_http_path			"/configs/"	// note trailing slash
set g_http_proxy		""
set g_idle_time			"150"
set g_intermission_time		"5"
set g_itdmflags			"142427"
set g_itemflags			"512"	// items removed (BFG)
set g_locked_names		"0"
set g_locked_skins		"1"
set g_maplistfile		"maps.txt"
set g_match_countdown		"15"
set g_match_time		"600"	// 10 minutes
set g_max_players_per_team	"4"
set g_max_timeout		"60"
set g_motd_message		"admin: tft.prt0@gmail.com"
set g_overtime			"60"
set g_playerconfig_enabled	"1"
set g_powerupflags		"14"
set g_record_mvd		"0"
set g_ready_attention		"1"
set g_respawn_time		"5"
set g_select_empty		"0"
set g_tdm_allow_pick		"1"
set g_tdm_spawn_mode		"1"
set g_tdmflags			"1040"
set g_team_a_name		"Home"
set g_team_b_name		"Away"
set g_team_a_skin		"male/grunt"
set g_team_b_skin		"female/athena"
set g_teleport_nofreeze		"0"
set g_tie_mode			"1"
set g_timeout_limit		"2"
set g_vote_attention		"1"
set g_vote_attention_sound	"misc/pc_up.wav"
set g_vote_mask			"-1"	// all votes allowed
set g_vote_time			"30"
set g_weapon_hud		"1"
set g_weapon_timer		"1"

// q2admin specific stuff (will be moved to q2admin.cfg soon)
set q2adminanticheat_enable     "0"

exec anticheat.cfg

