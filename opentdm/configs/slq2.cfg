set g_match_time                "1200"    // 20 minutes
set g_overtime                  "300"    // 5 minutes
set g_chat_mode                 "0"     // whisper mode, spectators only with other spectators
set g_armor_timer               "1"     // disable in-hud timer
set g_weapon_timer              "1"     // disable in-hud timer
set g_itemflags                 "0"     // all guns available
set g_powerupflags              "0"     // all powerups available
set g_max_timeout               "300"   // 5 min timeouts
set g_timeout_limit             "3"     // timeouts alive
set g_force_screenshot          "1"     // force players at intermission
set g_force_record              "1"     // force at intermission
set g_tdm_allow_pick            "1"     // direct picking, no accept needed
set g_tdm_flags                 "1072"  // force respawn + instant items + same level
set g_gamemode                  "0"     // tdm
set g_tie_mode                  "1"     // overtime
set g_bugs                      "0"     // all legacy bugs fixed
set g_auto_rejoin_map           "1"     // rejoin teams after last map
set g_auto_rejoin_match         "1"     // rejoin teams after match
set g_record_mvd                "1"     // record serverside demo
set g_highlight_captain         "1"     // * next to captains
